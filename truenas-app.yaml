# TrueNAS SCALE: Apps > Discover Apps > Custom App > "Install via YAML", paste this.
# Settings, the encrypted tokens and backups are kept in the homeclaude-data volume,
# which TrueNAS manages, like LiveMic's: no dataset or permissions to set up.
# Change the host port if 9085 is taken.
# pull_policy: always fetches the newest image each time the app is saved or redeployed.
services:
  homeclaude:
    container_name: homeclaude
    image: ghcr.io/leonidis2013/homeclaude:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - '9085:8080'
    environment:
      TZ: America/Chicago
    volumes:
      - homeclaude-data:/data

volumes:
  homeclaude-data:
