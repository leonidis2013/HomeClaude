# docker compose up -d
# Then open http://<this machine's IP>:8080, enter your Home Assistant address and a
# long-lived access token, and press Connect Claude.
# Settings, the encrypted tokens and backups are kept in the homeclaude-data volume.
services:
  homeclaude:
    image: ghcr.io/leonidis2013/homeclaude:latest
    pull_policy: always
    build: .
    container_name: homeclaude
    restart: unless-stopped
    ports:
      - "8080:8080"   # settings page; keep on your network
      - "8081:8081"   # public port for a reverse proxy (exposed mode only)
    volumes:
      - homeclaude-data:/data
    environment:
      TZ: America/Chicago

volumes:
  homeclaude-data:
